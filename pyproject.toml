[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nametag-press"
version = "1.0.0"
description = "Print-ready Avery badge sheets from the registrant roster"
requires-python = ">=3.11"
dependencies = [
  "eventkit-core[app] @ https://github.com/pu-shd/eventkit/archive/refs/tags/v0.3.0.tar.gz",
  "pydantic-settings>=2.2,<3",
  # The runtime image's CMD runs uvicorn. Without it here the container
  # cannot boot at all — and no test caught that, because the test stage
  # never starts the server the way production does.
  "uvicorn[standard]>=0.30,<1",
  "reportlab>=4.1,<5",
  "svglib>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=5.0", "respx>=0.21", "httpx>=0.27", "pypdf>=4.2"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
nametag_press = "nametag_press.cli:main"

[tool.hatch.metadata]
# The eventkit dependency is a pinned GitHub tarball, which hatchling treats as a
# direct reference and refuses by default.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nametag_press"]
artifacts = ["src/nametag_press/static/**"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; placeholder tokens are fixtures; xml parsing
# here is of output this repository just produced, not untrusted input.
"tests/**" = ["S101", "S105", "S106", "S314"]
